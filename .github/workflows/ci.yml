name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pedidos-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw test

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pedidos-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pedidos-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pedidos-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pedidos-web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pedidos-web/package-lock.json
      - run: npm ci
        working-directory: pedidos-web
      - run: npx playwright install --with-deps chromium
        working-directory: pedidos-web
      - run: npx playwright test
        working-directory: pedidos-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: pedidos-web/playwright-report/
          retention-days: 7
