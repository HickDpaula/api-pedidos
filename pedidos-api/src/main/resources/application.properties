spring.application.name=pedidos-api

spring.datasource.url=jdbc:h2:file:./data/pedidosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Schema gerenciado pelas migrations em db/migration (Flyway), nao mais pelo
# Hibernate. baseline-on-migrate trata o banco de dev existente (criado antes
# do Flyway entrar) como ja estando na V1, sem tentar recriar as tabelas.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Desligue via H2_CONSOLE_ENABLED=false em qualquer ambiente que nao seja dev local.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Defina JWT_SECRET no ambiente em qualquer deploy real — o valor abaixo e so pra dev local.
app.jwt.secret=${JWT_SECRET:pedidos-api-jwt-secret-chave-segura-para-desafio-foody-2026}
app.jwt.expiration-ms=86400000

# Lista separada por virgula. Defina CORS_ALLOWED_ORIGINS com a origem real do front em produção.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}